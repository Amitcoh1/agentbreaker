name: publish

# Publishes to PyPI on every merge to main — but only actually uploads when the version
# in pyproject.toml is new. PyPI versions are IMMUTABLE (a version can never be published
# twice), so `skip-existing: true` makes merges that don't bump the version graceful no-ops.
#
# To cut a release: bump `version` in pyproject.toml in your PR; merging it publishes that
# version. Merges that don't touch the version publish nothing.
#
# Auth: PyPI Trusted Publishing (OIDC) — no token to manage. One-time setup on PyPI: add a
# trusted publisher to the `breakerbox` project → owner `Amitcoh1`, repo `agentbreaker`,
# workflow `publish.yml`, environment `pypi` (see LAUNCH.md). Also create a GitHub
# environment named `pypi`.

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: ruff check .
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Version unchanged since last merge → the file already exists → skip, don't fail.
          skip-existing: true
