name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  test-langchain1:
    # #146: verify guard() + BreakerboxMiddleware on the modern stack (langchain / langgraph 1.x).
    # The `test` job above pins langchain-core 0.3; this leg installs the `langchain1` extra, which
    # upgrades to 1.x, so the importorskip-gated middleware tests activate and the callback path is
    # exercised on the runtime 2026 agents actually ship.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,otel,langchain1]"
      # guard against the extra silently resolving to 0.3 — this leg is meaningless on old langchain.
      - run: python -c "import langchain_core as c; assert c.__version__[0] == '1', c.__version__"
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test # vitest: TS↔Python codegen/validator golden parity
      - run: npm run build

  marketing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/marketing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/docs/package-lock.json
      - run: npm ci
      - run: npm run build # fumadocs-mdx generates .source, then next build type-checks
