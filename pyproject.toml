[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breakerbox"
version = "1.0.0"
description = "Runtime spend enforcement for AI agents — trip, degrade, and stop, not just alert. Provable ceilings, loop detection, escrow, and security scanning."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Amit Cohen", email = "amit.cellebrite@gmail.com" }]
keywords = ["langgraph", "llm", "budget", "circuit-breaker", "agents", "cost"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
# Runtime deps are added per phase (see DECISIONS.md).
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "tiktoken>=0.7",
    "jinja2>=3.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]
# The LangChain 1.x agent-middleware front-end (breakerbox.middleware, #146). Opt-in: the core
# library + guard() run on langchain-core 0.3; this extra enables BreakerboxMiddleware on 1.x agents.
langchain1 = ["langchain>=1", "langgraph>=1"]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6", "opentelemetry-sdk>=1.20"]

[project.scripts]
breakerbox = "breakerbox.cli:main"

[project.urls]
Homepage = "https://github.com/Amitcoh1/agentbreaker"

[tool.hatch.build.targets.wheel]
packages = ["src/breakerbox"]

# Without this, the sdist defaults to the whole repo — it swept in cloud/**/node_modules
# + .next caches (235 MB, over PyPI's 100 MB limit). Scope it to actual source.
[tool.hatch.build.targets.sdist]
only-include = ["src/breakerbox", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Golden codegen fixtures are generated artifacts, not source — don't lint them.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
