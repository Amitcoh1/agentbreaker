[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbreaker"
version = "0.0.1"
description = "Circuit breaker + hierarchical cost budgeting for AI agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Amit Cohen", email = "amit.cellebrite@gmail.com" }]
keywords = ["langgraph", "llm", "budget", "circuit-breaker", "agents", "cost"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
# Runtime deps are added per phase (see DECISIONS.md).
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "tiktoken>=0.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6"]

[project.scripts]
agentbreaker = "agentbreaker.cli:main"

[project.urls]
Homepage = "https://github.com/amitcohen/agentbreaker"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbreaker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
